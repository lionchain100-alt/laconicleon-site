# GitHub OAuth 凭据配置完成后，后台可在 /admin 使用。
backend:
  name: github
  repo: lionchain100-alt/laconicleon-site
  branch: main
  base_url: https://laconicleon.com
  auth_endpoint: api/auth
media_folder: public/uploads
public_folder: /uploads
collections:
  - name: site_settings
    label: 网站设置
    files:
      - name: projects
        label: GitHub 项目同步
        file: src/data/project-settings.json
        fields:
          - label: 要同步的公开 GitHub 项目
            name: selectedProjects
            widget: select
            multiple: true
            options:
              - { label: "Image to Text", value: "image-to-text" }
              - { label: "Handwriting to Notion", value: "handwriting-to-notion" }
              - { label: "BioLink Pro", value: "biolink-pro" }
              - { label: "Note OCR Backend", value: "note-ocr-backend" }
              - { label: "Codex 橙皮书", value: "codex-orange-book" }
              - { label: "Laconicleon Site", value: "laconicleon-site" }
              - { label: "Calculator Toolkit（私有）", value: "calculator-toolkit" }
              - { label: "Seating Chart Maker（私有）", value: "seating-chart-maker" }
              - { label: "Move Playbook（私有）", value: "moveplaybook" }
              - { label: "Bingo Card Generator（私有）", value: "bingo-card-generator" }
              - { label: "BacklinkOpsKit（私有）", value: "BacklinkOpsKit" }
              - { label: "Personal Site Opportunity Research System（私有）", value: "personal-site-opportunity-research-system" }
              - { label: "Printable Family Chart Cluster（私有）", value: "printable-family-chart-cluster" }
              - { label: "WeddingSpeechKit（私有）", value: "WeddingSpeechKit" }
  - name: posts
    label: 文章
    folder: src/content/posts
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: 标题, name: title, widget: string }
      - { label: 摘要, name: description, widget: text }
      - { label: 发布日期, name: publishedAt, widget: datetime, format: "YYYY-MM-DD" }
      - { label: 草稿, name: draft, widget: boolean, default: false, required: false }
      - { label: 首页精选, name: featured, widget: boolean, default: false, required: false }
      - { label: 分类, name: category, widget: string, default: "写作", required: false }
      - { label: 封面图, name: cover, widget: image, required: false }
      - { label: 标签, name: tags, widget: list, required: false }
      - { label: 语言, name: language, widget: select, options: ["zh", "en"], default: "zh" }
      - { label: 翻译编号, name: translationKey, widget: string, required: false, hint: "中英文版本使用同一编号，例如 png-to-pdf" }
      - { label: 正文, name: body, widget: markdown }
